<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Prep Hub</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface2: #1e1e1e;
      --border: #262626;
      --text: #e5e5e5;
      --muted: #737373;
      --accent: #818cf8;
      --high: #f87171;
      --med: #fb923c;
      --low: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 14px; line-height: 1.6; min-height: 100vh;
    }

    /* ── Primary nav ── */
    .header { padding: 24px 32px 0; border-bottom: 1px solid var(--border); }
    .header-top { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
    .header-top h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
    .header-top span { font-size: 12px; color: var(--muted); }

    .primary-nav { display: flex; gap: 4px; overflow-x: auto; }
    .pnav-btn {
      padding: 9px 18px; border-radius: 8px 8px 0 0;
      border: 1px solid transparent; border-bottom: none;
      background: none; color: var(--muted);
      font-size: 14px; font-weight: 500; cursor: pointer;
      white-space: nowrap; transition: color .15s, background .15s;
    }
    .pnav-btn:hover { color: var(--text); background: var(--surface2); }
    .pnav-btn.active { background: var(--surface); color: var(--text); border-color: var(--border); }

    /* ── Secondary (category) filter ── */
    .secondary-nav {
      display: flex; gap: 6px; padding: 12px 32px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .snav-btn {
      padding: 4px 12px; border-radius: 20px;
      border: 1px solid var(--border);
      background: none; color: var(--muted);
      font-size: 12px; font-weight: 500; cursor: pointer;
      white-space: nowrap; transition: all .15s;
    }
    .snav-btn:hover { color: var(--text); border-color: #444; }
    .snav-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── Main ── */
    .main { padding: 24px 32px 48px; max-width: 860px; }
    .section-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .6px; color: var(--muted); margin-bottom: 16px;
    }

    /* ── Group header (used in "All" view) ── */
    .group-header {
      font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .5px;
      margin: 28px 0 12px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .group-header:first-child { margin-top: 0; }

    /* ── Company pill ── */
    .co-pill {
      display: inline-block; padding: 2px 8px; border-radius: 20px;
      font-size: 11px; font-weight: 600; flex-shrink: 0;
    }

    /* ── Type badge (for All view) ── */
    .type-badge {
      display: inline-block; padding: 2px 7px; border-radius: 4px;
      font-size: 10px; font-weight: 700; letter-spacing: .4px;
      text-transform: uppercase; flex-shrink: 0;
      background: var(--surface2); color: var(--muted);
      border: 1px solid var(--border);
    }

    /* ── Risk badge ── */
    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 4px;
      font-size: 10px; font-weight: 700; letter-spacing: .5px;
      text-transform: uppercase; flex-shrink: 0;
    }
    .high   { background: rgba(248,113,113,.15); color: var(--high); }
    .medium { background: rgba(251,146,60,.15);  color: var(--med);  }
    .low    { background: rgba(52,211,153,.15);   color: var(--low);  }

    /* ── Accordion card ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; margin-bottom: 8px; overflow: hidden;
    }
    .card-head {
      padding: 13px 16px; display: flex; align-items: center;
      gap: 8px; cursor: pointer; user-select: none; transition: background .1s;
    }
    .card-head:hover { background: var(--surface2); }
    .card-num {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--surface2); border: 1px solid var(--border);
      font-size: 11px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); flex-shrink: 0;
    }
    .card-title { font-weight: 500; font-size: 14px; flex: 1; }
    .chevron { color: var(--muted); font-size: 11px; transition: transform .2s; flex-shrink: 0; }
    .card.open .chevron { transform: rotate(90deg); }
    .card-body { display: none; padding: 4px 16px 16px; border-top: 1px solid var(--border); }
    .card.open .card-body { display: block; }
    .sub-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .5px; margin-top: 14px; margin-bottom: 6px;
    }
    .problem-block {
      font-size: 13px; line-height: 1.65; padding: 10px 13px;
      background: rgba(239,68,68,.06); border-left: 3px solid var(--high);
      border-radius: 0 6px 6px 0; color: #fca5a5;
    }
    .fix-block {
      font-size: 13px; line-height: 1.65; padding: 10px 13px;
      background: rgba(52,211,153,.06); border-left: 3px solid var(--low);
      border-radius: 0 6px 6px 0; color: #6ee7b7;
    }
    .trigger-list { list-style: none; margin-top: 6px; }
    .trigger-list li { font-size: 12px; color: var(--muted); padding: 2px 0; }
    .trigger-list li::before { content: "↳ "; color: var(--accent); }

    /* ── Retro compare ── */
    .retro-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    @media (max-width: 620px) { .retro-compare { grid-template-columns: 1fr; } }
    .retro-panel { padding: 13px; border-radius: 8px; font-size: 13px; line-height: 1.65; }
    .retro-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
    .wrong-panel { background: rgba(239,68,68,.06); border: 1px solid rgba(239,68,68,.2); }
    .wrong-panel .retro-label { color: var(--high); }
    .right-panel { background: rgba(52,211,153,.06); border: 1px solid rgba(52,211,153,.2); }
    .right-panel .retro-label { color: var(--low); }

    /* ── Expected Qs ── */
    .headline-block {
      background: rgba(129,140,248,.08); border: 1px solid rgba(129,140,248,.2);
      border-radius: 8px; padding: 10px 14px; font-size: 13px;
      color: var(--accent); margin-bottom: 14px;
    }
    .headline-block .sub-label { color: rgba(129,140,248,.6); margin-top: 0; }
    .answer-text { font-size: 13px; line-height: 1.75; color: var(--muted); white-space: pre-wrap; }

    /* ── My Questions ── */
    .q-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 620px) { .q-grid { grid-template-columns: 1fr; } }
    .q-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
    .q-panel h3 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 14px; }
    .q-item { padding: 8px 0; font-size: 13px; line-height: 1.5; border-bottom: 1px solid var(--border); }
    .q-item:last-child { border-bottom: none; }

    /* ── Empty ── */
    .empty { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 13px; }
  </style>
</head>

      company: "Boomi", category: "process", risk: "high",
      question: "How would you design [X] for Boomi?",
      headline: "First — who's the user and what's the core job? Then let me sketch a direction and talk trade-offs.",
      answer: "Step 1 — Clarify (15 sec): Before I sketch anything: Who's the primary user — developer building integrations, or business user using no-code tools? What's the core job? What does success look like — speed, accuracy, confidence?\n\nStep 2 — Frame the tension (30 sec): Name the core design tension. For an agent dashboard: comprehensive visibility vs. actionable focus. Users don't need to see 1,000 things; they need to see the 3 that need attention right now.\n\nStep 3 — Sketch a direction (60 sec): Status-first view — healthy agents collapsed into summary count, agents needing attention surface with clear status and recommended actions. Progressive disclosure: summary → detail → action.\n\nStep 4 — Trade-offs (30 sec): Simplicity vs. control. Solve with role-based defaults — business users see simplified view, developers see detailed view — both can switch.\n\nStep 5 — Validation (15 sec): I'd run a prototype test with 3–5 users from each persona — scenario: 'one of your agents just failed, find it and fix it.' Measure task completion time and confidence. Iterate before committing to the full build."
    },
    {
      company: "Boomi", category: "behavioral", risk: "medium",
      question: "Tell me about a time you simplified something complex.",
      headline: "I restructured a 4-click flow into a 2-click flow by redesigning the IA. 50% fewer clicks, 40% more engagement.",
      answer: "The reward redemption flow at CarltonOne. The platform served 500+ enterprise clients with a massive catalog — merchandise, gift cards, tickets, experiences — and users couldn't find what they were looking for. The existing flow buried categories behind 4 clicks, and only 15% of users ever discovered the featured brands section.\n\nI restructured the information architecture: exposed top-level taxonomy directly in a mega-menu, surfaced featured brands at the first level, and designed one flexible template that worked across different content types.\n\nResult: 50% fewer clicks to reach products, 40% increase in featured brand engagement, and engineering shipped it faster because one template replaced multiple custom patterns.\n\nThis is the same design challenge Boomi faces at a different scale — making a complex integration platform approachable without dumbing it down. Expose what matters most, use progressive disclosure for depth, design systems rather than one-off screens."
    },
    {
      company: "Boomi", category: "collab", risk: "medium",
      question: "How do you work with engineers?",
      headline: "I bring engineers in during ideation, not at handoff — here's a specific trade-off conversation.",
      answer: "I bring engineers in during ideation because the best design decisions happen when technical constraints are on the table early.\n\nConcrete example: on the storefront redesign, I proposed exposing all category levels in the navigation. The developer flagged a performance concern — rendering that many nodes on load would slow the page. So we scoped it to two levels and shipped in half the time. That specific trade-off conversation is what I mean by early collaboration.\n\nIt also means I've learned to size solutions jointly — I'll sketch three options, we quickly assess effort vs. impact, and commit to the one that balances both. For Boomi, where integrations are complex and engineering constraints are real, that model matters even more."
    },
    {
      company: "Boomi", category: "personas", risk: "medium",
      question: "How do you handle designing for multiple user personas?",
      headline: "Map the tension between personas first, then design for both with progressive disclosure.",
      answer: "At CarltonOne I designed for two primary personas with very different needs — admins configuring the platform and employees using it. The tension: admins needed control and visibility, employees needed simplicity and speed.\n\nMy approach: design for the most constrained persona first (employees needing simplicity), then layer in admin controls as secondary paths. Progressive disclosure meant employees didn't see complexity they didn't need, but admins could surface it.\n\nThis maps directly to the Boomi tension between developer users building integrations and business users using no-code tools. Same principle: design for clarity first, expose depth for the power user. Role-based defaults let each persona see the right level of complexity without feeling limited or overwhelmed."
    }
  ],

  myQuestions: {
    asked: [],
    shouldHaveAsked: []
  }
};

let currentSection = "all";
let currentCat = "all";

function companyPill(company) {
  const s = COMPANY_STYLE[company] || { bg: "rgba(150,150,150,.15)", color: "#aaa" };
  return `<span class="co-pill" style="background:${s.bg};color:${s.color}">${company}</span>`;
}

function render() {
  const showCatFilter = currentSection !== "myQuestions";
  document.getElementById("app").innerHTML = `
    <div class="header">
      <div class="header-top">
        <h1>Interview Prep</h1>
        <span>${Object.keys(COMPANY_STYLE).length} companies</span>
      </div>
      <nav class="primary-nav">
        ${SECTIONS.map(s => `
          <button class="pnav-btn ${s.key === currentSection ? "active" : ""}"
                  onclick="switchSection('${s.key}')">${s.label}</button>
        `).join("")}
      </nav>
    </div>
    ${showCatFilter ? `
      <div class="secondary-nav">
        ${CATEGORIES.map(c => `
          <button class="snav-btn ${c.key === currentCat ? "active" : ""}"
                  onclick="switchCat('${c.key}')">${c.label}</button>
        `).join("")}
      </div>` : ""}
    <div class="main">${renderSection()}</div>
  `;
  document.querySelectorAll(".card-head").forEach(el => {
    el.addEventListener("click", () => el.closest(".card").classList.toggle("open"));
  });
}

function switchSection(s) { currentSection = s; render(); }
function switchCat(c) { currentCat = c; render(); }

function filtered(arr) {
  if (!arr) return [];
  return currentCat === "all" ? arr : arr.filter(i => i.category === currentCat);
}

function renderSection() {
  if (currentSection === "all")         return renderAll();
  if (currentSection === "feedback")    return renderFeedback(filtered(db.feedback));
  if (currentSection === "retro")       return renderRetro(filtered(db.retro));
  if (currentSection === "expectedQs")  return renderExpected(filtered(db.expectedQs));
  if (currentSection === "myQuestions") return renderMyQs(db.myQuestions);
  return "";
}

function renderAll() {
  const fb = filtered(db.feedback);
  const rt = filtered(db.retro);
  const eq = filtered(db.expectedQs);
  if (!fb.length && !rt.length && !eq.length) return empty("Nothing found for this topic.");
  let html = "";
  if (fb.length) html += `<div class="group-header">Feedback (${fb.length})</div>` + renderFeedback(fb, true);
  if (rt.length) html += `<div class="group-header">Retro (${rt.length})</div>` + renderRetro(rt, true);
  if (eq.length) html += `<div class="group-header">Expected Q's (${eq.length})</div>` + renderExpected(eq, true);
  return html;
}

function renderFeedback(items, inAll = false) {
  if (!items.length) return empty("No feedback for this topic.");
  return items.map((item, i) => `
    <div class="card">
      <div class="card-head">
        ${inAll ? "" : `<div class="card-num">${i + 1}</div>`}
        <div class="card-title">${item.title}</div>
        ${companyPill(item.company)}
        <span class="chevron">&#9654;</span>
      </div>
      <div class="card-body">
        <p class="sub-label" style="color:var(--high)">The problem</p>
        <div class="problem-block">${item.problem}</div>
        <p class="sub-label" style="color:var(--low)">What to do instead</p>
        <div class="fix-block">${item.fix}</div>
        <p class="sub-label" style="color:var(--muted)">Watch for in these questions</p>
        <ul class="trigger-list">${item.triggers.map(t => `<li>${t}</li>`).join("")}</ul>
      </div>
    </div>`).join("");
}

function renderRetro(items, inAll = false) {
  if (!items.length) return empty("No retro notes for this topic.");
  return items.map(item => `
    <div class="card">
      <div class="card-head">
        <span class="badge ${item.risk}">${item.risk}</span>
        <div class="card-title">${item.question}</div>
        ${companyPill(item.company)}
        <span class="chevron">&#9654;</span>
      </div>
      <div class="card-body">
        <div class="retro-compare">
          <div class="retro-panel wrong-panel">
            <div class="retro-label">&#10005; What I said</div>${item.whatISaid}
          </div>
          <div class="retro-panel right-panel">
            <div class="retro-label">&#10003; Better answer</div>${item.betterAnswer}
          </div>
        </div>
      </div>
    </div>`).join("");
}

function renderExpected(items, inAll = false) {
  if (!items.length) return empty("No expected questions for this topic.");
  return items.map(item => `
    <div class="card">
      <div class="card-head">
        <span class="badge ${item.risk}">${item.risk}</span>
        <div class="card-title">${item.question}</div>
        ${companyPill(item.company)}
        <span class="chevron">&#9654;</span>
      </div>
      <div class="card-body">
        <div class="headline-block">
          <div class="sub-label">10-second headline</div>${item.headline}
        </div>
        <div class="answer-text">${item.answer}</div>
      </div>
    </div>`).join("");
}

function renderMyQs(qs) {
  const asked = qs?.asked ?? [];
  const shouldHave = qs?.shouldHaveAsked ?? [];
  const col = (title, items) => `
    <div class="q-panel">
      <h3>${title}</h3>
      ${items.length
        ? items.map(q => `<div class="q-item">${q}</div>`).join("")
        : `<div style="font-size:13px;color:var(--muted);padding-top:4px">Nothing logged yet.</div>`}
    </div>`;
  return `<p class="section-label">Questions during the interview</p>
    <div class="q-grid">${col("Questions I asked them", asked)}${col("Should have asked", shouldHave)}</div>`;
}

function empty(msg) {
  return `<div class="empty"><div style="font-size:28px;margin-bottom:10px">&#8212;</div><div>${msg}</div></div>`;
}

render();
</script>
</body>
</html>
