Strengths:
\u{2022} Strong storytelling and personal brand (Camino story was memorable)
\u{2022} Excellent process documentation and frameworks
\u{2022} Good initiative-taking examples
\u{2022} Authentic passion for AI tools and vibe coding

Areas for Improvement:
\u{2022} Some answers were unfocused/rambling
\u{2022} Defensive responses to design critiques
\u{2022} Missed opportunities to connect experience to OpusClip's needs
\u{2022} Time management (presentation ran long)

Likelihood of moving forward: 60\u{2013}70%`),k(`ACTION ITEMS FOR NEXT INTERVIEWS

Before: Research the company's AI features deeply. Prepare 3 specific examples of how your AI skills solve their problems. Script answers to common critiques. Time your presentation (aim for 20\u{2013}25 min max).

During: Answer first, elaborate only if asked. Own decisions with data, then show openness. Turn every constraint into a strength. Ask questions that show you understand their challenges.

After: Send thank-you email within 24 hours. Reference specific discussion points. Share one additional resource (e.g., your plugin, a relevant article).`),k(`QUESTIONS I SHOULD HAVE ASKED

1. "What's the biggest UX challenge with AI-generated video clips right now?" \u{2014} Shows thinking about their core product.
2. "How do you balance AI automation with creator control in the product?" \u{2014} Demonstrates understanding of AI UX tension.
3. "What does success look like for this role in the first 90 days?" \u{2014} Shows outcome-focus.
4. "How does the design team work with AI/ML engineers when features are still experimental?" \u{2014} Relevant to their AI-first environment.`)],qaPairs:[S("Is this the process you apply every time when you start a new project?","Yes, this is my standard approach for ambiguous projects. I always start by aligning stakeholders on three things: what we know, what we don't know, and what questions will close the gap. I bring visuals to every discussion because teams make faster decisions when they can react to something tangible. This framework has been especially valuable in B2B environments where requirements start vague."),S("Can I ask more detail about the open questions, design considerations, and user survey questions?",'These are the three frameworks I use to structure ambiguous projects. Open questions identify what we don\'t know — like "What\'s causing the drop-off?" Design considerations are the constraints we need to design within — scalability, white-label flexibility, technical debt. And user survey questions are what I\'d ask end users if I had access — I use these to guide CS team interviews and validate assumptions. These three lenses help me move from "improve the experience" to "solve this specific problem."'),S("So you will conduct a survey by yourself as well?","In an ideal setup, yes — but in this case I leveraged the CS team instead. They had direct access to users through support tickets and the in-platform survey tool. I provided them with specific questions to ask and patterns to look for, then analyzed their findings alongside behavioral data. It's not as rich as moderated user research, but it gave me enough signal to validate the core problem: users couldn't discover what was available."),S("Do you think you get enough information from this part to fill the gap?","Yes, I did — though it required being resourceful. The CS team gave me qualitative data from 100+ support tickets that revealed patterns our analytics missed. I cross-referenced this with competitive analysis and platform behavioral data. While it wasn't perfect, the 50% click reduction after launch validated we'd identified the right problem."),S("When you prepare the whole framework ideation, how did you interact with your team?","I led the ideation independently, then facilitated a collaborative review session. I'd come prepared with a structured framework — design considerations, open questions, user survey questions — then walk the team through each element and explain my reasoning. We'd discuss feasibility together, and the PM and lead developer would flag what's realistic. Not every idea made it through, but having that visual framework meant we could make decisions faster. For example, we used an impact-versus-effort matrix to prioritize which UI solutions to ship first."),S("Did you get into some details about the design considerations? Is it just you brainstorming, or with the team?","I initiated independently, then collaborated to refine. I'd brainstorm the design considerations solo first — things like scalability across client setups, technical constraints, business goals — then bring those to the team to stress-test. The meeting was where we'd validate assumptions, flag technical limitations, and prioritize together. For example, I proposed showing all category levels upfront, but the developer flagged performance concerns, so we scoped it to two levels. It's a balance between coming prepared and staying flexible."),S("Do you think the final design aligned with the framework ideation process?","Not exactly — and that was by design. The framework wasn't meant to predict the final output. It was a starter kit I built to get the team aligned fast — organizing what we knew, what we didn't, and what questions would close the gap. It ignited the right conversations early, like the impact-effort matrix that directly shaped our MVP priorities. Some ideas got cut due to technical constraints, new ones emerged through collaboration — but the framework gave us a shared decision-making tool that kept us moving. It's a guide, not a script."),S("Can we go back to the design? The branding is very different from the previous version.","Great question — yes, this looks like two different platforms, but it's the same product at different stages. The \"before\" screenshot is from our internal dogfooding environment, which was built before I joined and had no design system. By the time we redesigned the redemption flow, we'd established a design library, so the visual language changed dramatically even though the information architecture stayed similar. I should have flagged this upfront. Thanks for catching it."),S("What's the difference between the labels beneath the search bar and the labels in the dropdown?","The top labels are first-level categories, and the pills below are second-level subcategories. Think of it like: Merchandise (L1) → Appliances (L2) → Coffee Makers (L3). We only surface two levels in the dropdown to avoid overwhelming users — analytics showed most users navigate through L1 and L2, then use search or filters to find specific items. The hierarchy gives structure without forcing users to memorize the full taxonomy."),S("If I hover on different categories like gift cards or tickets, what happens?","The layout stays consistent, but the content changes based on category type. For standard categories like Merchandise, you see Featured Brands, Categories, and Special Offers. For third-party integrations like Gift Cards or Tickets & Events, the same four-section layout displays promotional CTAs instead, since those don't have subcategories. We chose one flexible template that works for both content types rather than designing separate patterns — this kept the experience predictable while reducing engineering complexity."),S("My expectation was to see actual merchandise, not brands and categories. Did you test different layouts?","That's a fair expectation, and we did prototype showing products directly. We tested three approaches: showing products upfront, showing brands/categories, and a hybrid. The brands/categories approach won for two specific reasons: First, our catalog is huge — showing products would mean endless scrolling or arbitrary curation. Second, analytics showed users who browsed by brand converted 30% higher than those who searched by product. That said, your point about visual hierarchy is valid — if I were iterating, I'd A/B test reducing the featured brands section to two logos instead of three to create clearer visual flow."),S('If I click "View All" in merchandise versus featured brands, do they go to the same page?','No, they lead to different filtered views. "View All" under Merchandise shows the entire product catalog with all category filters available. "View All" under Featured Brands shows only products from featured brands — it\'s pre-filtered. Think of Featured Brands as a curated shortcut for users who trust brand names and want faster decisions. We tracked that featured brand navigation had 40% higher conversion, so we made it prominent.'),S("How would you combine AI workflow into a real design process?","I'd integrate AI into three stages: exploration, refinement, and validation. During exploration, I use AI to prototype interactions in working code before spending time on high-fidelity designs — I can test five different interaction patterns in the time it used to take for one mockup. During refinement, I collaborate with engineers via tools like Claude Code to iterate on UI details directly in the codebase, eliminating traditional handoff delays. During validation, I can ship testable prototypes to users faster — days instead of weeks. The key is treating AI as a velocity multiplier, not just an automation tool."),S("Do you think asking the agent to implement the feature directly, then going back to Figma to refine, is a good workflow?","Yes — and I think this flips the traditional design workflow in a powerful way. Instead of spending days perfecting mockups before knowing if something's technically feasible, I can now validate the interaction in working code first, then refine the visual design. The key enabler is having a strong design system — if your tokens, components, and patterns are well-documented, the AI can implement consistently without you micromanaging every pixel. At CarltonOne, building the design system upfront is what made vibe coding viable for me later."),S("I was wondering if this position is for senior or intermediate designer?","Intermediate level aligns well with where I am. I've been leading projects end-to-end for three years, but I'm excited to learn from a senior design team, especially in an AI-first product environment where the UX patterns are still being defined. What does the growth path typically look like for designers at OpusClip?"),S("What makes OpusClip successful in such a competitive AI market?",`[Their answer: Timing gave early lead, staying ahead requires relentless iteration, personalization direction \u{2014} AI-categorizing clips by intent.]

My response: That makes complete sense \u{2014} timing gave you the early lead, but staying ahead requires relentless iteration. I'm especially interested in the personalization direction \u{2014} AI-categorizing clips by educational versus engagement intent. That's the kind of feature that creates real lock-in for creators because it understands their workflow, not just automates it.`),S("What kind of tools are designers allowed to use within the work environment?",`[Their answer: Freedom to experiment, encouraged to try new tools.]

My response: That's exactly the environment where I thrive. At CarltonOne, I pushed boundaries by leading AI workshops and building the Figma plugin on the side, which ended up improving our internal workflows. If I joined OpusClip, I'd want to explore how AI tools could speed up prototyping for creator-facing features \u{2014} maybe building internal tools or MCP servers that let us test AI-generated video variations faster.`),S("What's your competitive strategy? How do you grow?",`[Their answer: Two-pronged \u{2014} expanding upstream to video creation while deepening core clipping.]

My response: The AI categorization feature is particularly interesting because it's moving from automation to intelligence \u{2014} instead of just splitting videos, you're understanding creator intent. From a UX perspective, that's where trust becomes critical: creators need to feel in control while benefiting from AI recommendations. How are you balancing showing the AI's reasoning versus just showing the output?`),S("How many miles did you walk on the Camino?","I did the full 800 kilometers — about 500 miles — from France to Spain over 40 days. It was one of the most formative experiences of my life. Walking and talking with people from completely different backgrounds every day taught me that understanding people is really understanding yourself. That curiosity is what keeps pushing me outside my comfort zone, both in life and in design."),S("Previously, if I wanted to see featured brands, what was the user flow?","It required four clicks and wasn't intuitive. Users had to: (1) Click \"Shop,\" (2) Notice the mega menu defaulted to Merchandise, (3) Scroll down past category pills, (4) Find the brand list at the bottom. Only 15% of users ever reached that view, which is why we surfaced it to the top level in the redesign. Post-launch, featured brand engagement jumped 40%. The difference wasn't just visual — it was making a valuable feature actually discoverable."),S("Do you have any last questions for me?","Yes — First, what's the biggest UX challenge with AI-generated video clips right now — is it more about giving creators control, or helping them discover what's possible? Second, how does the design team work with AI/ML engineers when features are still experimental — do you prototype UIs before the models are trained, or is it more iterative? And finally, what does success look like for this role in the first 90 days?")]},{id:x(),name:"Cova Software",category:"Cultural Fit",notes:[k(`INTERVIEWER FEEDBACK FROM COVA

Positives:
\u{2022} Sue was very articulate \u{2014} wasn't just "reading off the slides," very prepared and could clearly explain the work.
\u{2022} Loved that she shared her values at the beginning. Seemed genuine and those values came through in examples.
\u{2022} Sue seemed very proactive \u{2014} actively looking for how to improve products, not just working on assigned projects.
\u{2022} Appreciated her discussion of how designs highlighted the value of the program \u{2014} not just visual design focused but very UX and customer value oriented.
\u{2022} Sue seems very collaborative with others.

Areas for improvement:

4. Values alignment \u{2014} keep sharing values upfront, it resonated
5. STAR format \u{2014} Situation, Task, Action, Result with metrics where possible`)],qaPairs:[S("Tell us about who Sue is — not just as a designer, but as a person. What should we know about you?","I'm someone who's driven by curiosity and growth. I walked 800km on the Camino de Santiago, I run consistently, and I keep regular study sessions with other designers. These habits reflect how I approach work too — I'm disciplined about learning, I stay open to different perspectives, and I bring the same energy to understanding users as I do to understanding myself. In my design work, that shows up as genuine empathy for users and a bias toward making things better, not just shipping what's asked for."),S("What are the top 2–3 values you bring to a team?","Transparency, continuous learning, and proactive ownership. I believe teams work best when information flows openly and everyone feels safe to share feedback. I stay sharp through regular study sessions with other designers. And I don't wait to be told what to improve — at CarltonOne I identified the navigation problem, built the case for redesigning it, and led the project end-to-end."),S("When you think of a time you felt on fire, or it was working, and you loved it — what was happening?",'The moment that stands out is when I was building our design system from scratch at CarltonOne. I was solving a real, structural problem — inconsistent UI across a white-label platform serving 1000+ clients. I mapped the patterns, created reusable components, and documented everything so the team could scale without me reviewing every screen. What made it feel like "flow" was the combination of creative problem-solving, visible impact, and cross-functional alignment.'),S("Tell us about a time when things weren't going well — what happened and how did you handle it?","Early in the white-label redesign, I was struggling with getting stakeholder alignment because different teams had conflicting priorities. Client Success wanted faster setup, Product wanted scalability, and Engineering wanted less custom work. I stepped back and created a visual framework — the 70/30 model — that gave everyone a shared mental model: 70% standardized core, 30% flexible for edge cases. That reframing turned a stalled conversation into a clear direction."),S("If we asked your closest coworker, what would they say about what it's like to work with you?","They'd say I'm reliable, transparent, and genuinely invested in the team's success — not just my own deliverables. I over-communicate context so people always know where things stand. They'd also say I bring energy and curiosity — I'm the person who shares interesting articles in Slack, starts AI exploration sessions, and asks \"what if we tried this?\" in reviews. And they'd mention that I take feedback well and openly, which makes collaboration feel safe."),S("How do you deal with ambiguity — starting a project where things aren't clear?",'I start by documenting assumptions, listing unknowns, and identifying who has the information I need. I create lightweight visual artifacts — a flow, a framework, even rough sketches — to make the ambiguity tangible so the team can react to something concrete. At CarltonOne, when the ask was just "create our own product," I partnered with my UX lead to map the primary user journey and pressure-test early concepts within days. Making decisions visible and testable early is how I turn ambiguity into alignment.'),S("Tell us about a time when you were new to a situation and had to quickly build knowledge.","When I joined CarltonOne, the B2B rewards platform was completely unfamiliar — loyalty programs, white-labeling, client-specific configurations. I immersed myself by doing three things in parallel: auditing the existing product screens to understand patterns, interviewing the CS team who had 7–15 years of client knowledge, and mapping the end-to-end user journey. Within a few weeks I'd built enough context to identify the navigation discoverability problem that became my flagship project."),S("Can you tell us about a time you had a difference in opinion with somebody?",'During the gift card breakage project, leadership wanted to capitalize on unused balances by keeping them less visible — it was good for short-term margins. I disagreed because I believed hiding balance information eroded user trust, which would hurt long-term retention. I reframed it as a risk-management conversation: I proposed a more transparent design that still supported revenue — clear balance visibility, reminders, and honest explanations. By showing it wasn\'t "revenue vs. user experience" but "short-term gain vs. long-term trust," leadership aligned with the transparent approach.'),S("What does collaboration look like for you? Specific examples.",'For me, collaboration means early involvement and continuous alignment. On the storefront redesign, I didn\'t wait for the design to be "ready" — I looped in the lead developer during ideation to flag feasibility issues before I invested in high-fidelity mocks. We had lightweight check-ins throughout rather than one big handoff. I also collaborated closely with the CS team — they surfaced user pain points from support tickets, and I validated those against behavioral data. The result was a solution that was technically shippable, user-validated, and business-aligned.'),S("What does an ideal team or work environment look like for you?","An environment where people are transparent, feedback flows freely, and designers have a seat at the table — not just executing specs but shaping product direction. I thrive when there's trust to experiment (like my AI workshops and Figma plugin at CarltonOne) and when collaboration with engineering is close, not siloed. I also value a culture of learning — regular critiques, knowledge sharing, and the freedom to explore better ways of working."),S("Tell us about a time where you championed or promoted the work of somebody else.","When an engineer on my team solved a tricky implementation constraint that protected the user experience, I highlighted their contribution in our team channel and in the stakeholder update so their work was visible. That recognition helped build trust with leadership and made it easier for them to influence future decisions. I've learned that celebrating the right contributions publicly improves team morale and strengthens cross-functional collaboration."),S("Can you tell us about a time you had to fight for something you believed in?","I pushed back on the gift card breakage project because relying on users forgetting their balance creates long-term trust risk and can increase churn, support complaints, and brand damage. I reframed it as a risk-management conversation and proposed a more transparent design that still supports revenue — clear balance visibility, reminders, and an honest explanation of terms. That made it easier for leadership to align, because it protected the business while respecting users."),S("How do you stay engaged if you find yourself losing enthusiasm on a project?",'When I feel myself losing momentum on a project, I reset by clarifying what "success" means for the next milestone and breaking the work into a smallest shippable step. I\'ll also pull in quick signal — data, a user quote, or a short check-in with PM/Eng — so the work feels grounded and urgent again. Outside of work, I stay energized through consistent study sessions with other designers, which keeps me learning and connected.'),S("Tell us about a time you kept your opinion to yourself and didn't speak up. Would you do something differently?","There was a meeting where many stakeholders were debating solutions, and I held back in the moment because the conversation wasn't anchored on the decision we actually needed to make. If I could redo it, I'd step in and summarize the debate, name the decision point, and propose two clear options with trade-offs so we could align quickly. If time still didn't allow, I'd send a short follow-up immediately with the recommendation and rationale to keep the project moving."),S("Tell us about somebody in your life that you admire and how have they impacted you?","I admire my mentor because she's very genuine and emotionally honest, and it makes collaboration feel safe and productive. Because of her, I adopted a habit of naming concerns calmly and asking clarifying questions instead of becoming defensive when feedback is tough. That shift improved my stakeholder conversations and helped me resolve disagreements faster while keeping relationships strong."),S("Do you have any questions about what it's like to work at Cova?","I'd love to understand how customer insights flow into the roadmap here — who owns prioritization, and how do design, product, and client services collaborate to make trade-offs? Also, what does success look like for this role in the first 60–90 days — are there specific outcomes or metrics you'd expect me to move? And lastly, what's the team's current cadence for critique, design reviews, and decision-making so I can understand how work scales as the design function grows?")]},{id:x(),name:"Cova Software",category:"Technical Interview",notes:[k(`KEY INSIGHT: WHAT COVA VALUES IN TECHNICAL INTERVIEWS

you handle the shift from ideal design to real implementation when engineering constraints come up?",'I bring engineering in early, then frame decisions as trade-offs: protect the core user value, and downgrade anything that\'s expensive but non-essential. I align on a "vision vs phases" approach so we can ship something small quickly while keeping a coherent end state. After release, I validate direction using proxy signals when analytics are limited — like CS feedback and support patterns.'),S("What was your role versus others' roles on this project (UX lead + 2 designers)?","I was the DRI for this initiative: I identified the repeat patterns, aligned stakeholders on the 70/30 model, and drove the system direction from framing to rollout. The other designer partnered closely on execution and iteration, and our UX lead provided oversight and feedback at key checkpoints. My ownership was clearest in setting the scalable framework and getting cross-functional buy-in to ship it."),S('How did you come up with the "70/30" concept? Was it tested mathematically or more conceptual?',"I used 70/30 as a shared decision rule: standardize the repeatable core, and reserve flexibility for time-bound promotions and edge cases. The ratio came from consistent patterns we observed through client intake and CS/BA feedback rather than formal analytics. We used it to reduce over-customization and speed delivery, and tracked progress via directional indicators like fewer one-off design requests and smoother program setup conversations."),S("For impact vs effort prioritization: how far out did you think before presenting, and what did collaboration with developers look like?",'I translated a broad request into a flow-level opportunity map, then used Figma to make the problems and candidate solutions visible for quick cross-functional evaluation. With engineering, we did rough sizing — "this is a quick tweak" versus "this is a multi-sprint change" — and chose the smallest set of changes that materially improved discoverability while deferring anything that would balloon scope. Since analytics were limited, we validated direction through proxy signals like CS/support feedback and internal review.'),S("Did you need tooltips or in-product education when rolling out the changes?",'We intentionally avoided tooltips for the engagement platform redesigns because users visit infrequently and "what\'s new" messaging can create friction without adding value — especially when the change is minor and should be discoverable. We reserve tooltips for genuinely new behaviours where users would otherwise fail or hesitate, and we keep them minimal: first-session-only, dismissible, and tied to one critical action. In short: rely on good affordances by default, use tooltips only when the cost of confusion is higher than the cost of interruption.'),S('You started with a vague ask ("improve the shopping experience") but later had a clear HMW statement — how did you get there?','I started with a vague goal, then ran a structured discovery pass: mapped the flow, listed unknowns, and used a lightweight framework to turn them into targeted questions for Product/CS/Engineering. After synthesis, I wrote the HMW statement and used it as the decision filter for what to prioritize and what to cut before UI execution. It wasn\'t a retrospective summary — it became the working "north star" that aligned the team early.'),S("As you rolled out changes, did you learn anything that caused you to update the plan?","We didn't have robust analytics, so iteration was driven by proxy signals — CS feedback, recurring questions, and internal stakeholders who saw multiple client implementations. When those signals suggested confusion or missed needs, we adjusted the next round of improvements; when signals were quiet, we stayed the course. The principle was: keep the direction stable, but let details flex based on the best available evidence."),S("Is the Cova team using any AI tools or integrating AI into the software?","[Their answer] They're encouraged to innovate — AI is viewed as a tool in the tool shed, not mandated. If AI makes the product better or work more efficient, they explore it and share learnings. The team does show-and-tell knowledge sharing, and there's a range of adoption levels from heavy users to people who barely use it."),S("Is there a specific project planned for whoever joins in this position?",'[Their answer] Ongoing iterative improvement work. Near-term: POS web version needs stronger design cohesion (no dedicated designer for ~1 year). Back-office "receiving inventory" experience is fragmented across many touchpoints — they want a cohesive, integrated flow. Business value: smoother receiving flow reduces labour/time for store staff.'),S("Is your team using any usability testing tools or analytics tools?","[Their answer] Mixpanel for POS interactions/behaviour. Microsoft Clarity for e-commerce heatmaps and session replays. Sentry for developer-focused monitoring. NPS surveys and user feedback forms. Main challenge isn't getting feedback — it's acting on it and prioritizing with the volume of feedback they receive.")]},{id:x(),name:"CadMakers",category:"Technical Interview",notes:[k(`WHAT WORKED AGAINST ME

4. "How do designers and the 10 researchers collaborate day-to-day?" — Shows you’re ready to work with research`)],qaPairs:[S("Was this from a consultancy or internal UX team?","I was the lead UX designer on our internal product team, working cross-functionally with CS and Engineering to serve 500+ enterprise clients. When I mention team members, I\u2019m referring to internal teams."),S("Was there a design system used in the design?","We didn\u2019t have a formal design system when I started this project \u2014 that was actually one of the gaps that motivated me to build this template framework. Each template section became a reusable component pattern. After we validated the approach with clients, we formalized these patterns into a proper design system that both designers and developers could reference. That\u2019s what enabled us to scale from one template to 30+ across all program types."),S("Was there a system built after this shipped?","Yes \u2014 that was the whole point. After validating the templates with clients, we formalized it into a design system for designers and a component library for developers. Now when we get a new client, we review their requirements together, select the closest template, and customize from there. The system reduced both design AND development time \u2014 which is why we went from struggling with custom builds to launching 1,000+ programs in a year."),S("Was there any usability studies done while working on the designs?","I didn\u2019t have access to formal usability testing, so I got creative with validation. I ran an internal user survey with 11 employees who used our dogfooding program \u2014 they were actual end users, just internal. I combined that with stakeholder feedback from CS who had 7\u201315 years of client interaction data, and secondary research on similar platforms. Was it perfect? No. But it was enough to validate the direction. The real validation came post-launch \u2014 500+ clients adopted it, and we saw 30% revenue growth."),S("How were decisions made \u2014 your autonomy vs. management?","I initiated this project \u2014 I identified the problem through client work, validated it with the UX team, and proposed it to leadership. Once approved, I drove the work: conducted research, created design options, facilitated alignment sessions with UX, CS, and Engineering. The UX Lead had final approval on direction, which made sense given their technical background \u2014 but I owned the day-to-day decisions on layout structure, component patterns, and iteration. It was collaborative decision-making with clear ownership."),S("What were accessibility considerations?","Color contrast was the biggest challenge. We\u2019re white-label, so clients expect their brand colors everywhere \u2014 but some brand colors create accessibility issues. Take McDonald\u2019s red on navigation \u2014 it creates visual noise and fails contrast requirements. Our approach was to work with their secondary or tertiary colors first, and if those didn\u2019t work, we\u2019d tweak shades to meet WCAG standards while staying on-brand. We also made hero carousels static instead of auto-playing to avoid cognitive accessibility issues and motion sensitivity. Following WCAG strictly was non-negotiable."),S("Any other accessibility considerations beyond color contrast?","Yes \u2014 motion and cognitive accessibility with the hero carousel. Clients wanted auto-playing carousels with multiple images, but auto-play creates accessibility issues: motion sensitivity for some users, cognitive overload, and keyboard navigation challenges. We made it user-controlled instead \u2014 click to advance, no auto-play. That gave users control while still allowing the visual flexibility clients wanted."),S("How did you roll out updates to existing users?","Phased rollout. New clients got the new templates by default \u2014 CS showed them designs during onboarding. For existing clients, we waited for natural refresh points. We\u2019d show both options: keep current or upgrade. We\u2019d explain UX benefits \u2014 faster navigation, clearer value prop, better mobile \u2014 and 90% chose to upgrade. Never forced it, which preserved trust while gradually migrating the platform."),S("What was the biggest challenge?","Getting the user data I needed. No research team, no direct user access, no formal usability testing. But that constraint taught me how to be resourceful. I triangulated internal surveys, CS feedback from 7\u201315 years of client interactions, secondary research, and heuristic evaluation. The 500+ client adoption validated that the approach worked. Now I\u2019m excited to work WITH researchers at Boomi because I know what questions to ask and what gaps to fill."),S("How is Boomi implementing AI features from a design perspective?","[Asked by you \u2014 smart strategic question] His answer: Key consideration is how useful it is, doesn\u2019t feel like random add-on, what NEW experiences can we enable, research team tracks AI landscape and shares insights. Shows Boomi takes AI seriously and values usefulness over novelty."),S("What challenges do you have implementing AI features?","The biggest challenge isn\u2019t the technology, it\u2019s figuring out where AI genuinely improves the experience vs. where it\u2019s just novelty. I\u2019ve been experimenting with AI in my design process \u2014 built a Figma plugin, working with vibe coding \u2014 and the question I keep asking is: what new experiences does this enable that weren\u2019t possible before?"),S("How is Boomi getting user data?","[Asked by you \u2014 shows research mindset] His answer: Analytics platform tracking usage, what users use most/least, ongoing user studies with researchers, internal users (CS, support) and external users."),S("Collaboration with researchers \u2014 how would that work?","I\u2019m in a UX research study group with researchers from SFU\u2019s HCI program \u2014 learning research methods I haven\u2019t had resources to use before. I\u2019ve done research out of necessity \u2014 surveys, heuristic evaluation, stakeholder interviews \u2014 but I\u2019m excited about working WITH dedicated researchers. I know what questions I\u2019d ask them, what gaps I need filled, and how to translate findings into design principles. Having done it myself makes me a better collaborator."),S("Is AI allowed in design work? What tools?","[Asked by you] His answer: Not only allowed, entire team asked to incorporate AI. Still figuring out exact process. Experimental initiatives. Trying Claude, Figma Make. Boomi is ALL-IN on AI \u2014 matches your skills perfectly."),S("What do you mean by documentation being skipped?","With vibe coding, you can prototype so fast that you skip the Figma step entirely \u2014 just describe what you want, see it rendered in code instantly. Powerful for speed, but risky for collaboration. You lose the visual source of truth that non-technical stakeholders need. My approach is to export snapshots back to Figma at key decision points \u2014 design documentation checkpoints even when building in code. Speed AND clear communication."),S("What\u2019s your take on how AI is changing design process?","Traditional: define user group, research, design, iterate. With AI: start with small user group, build something, release, see if it works, keep recruiting more users to iterate. Process gets faster. Knowing what to build and why gets you there faster. Defining the problem is more important than ever. [YOUR STRONGEST ANSWER \u2014 10/10. Used a visual slide, clear before/after framework, strategic insight.]")]},{id:x(),name:"Match Group",category:"Technical Interview",notes:[k(`OVERALL ASSESSMENT\n\nPrimary Failure: Failed the strategic thinking test in two critical questions.\n\n\u2022 Design philosophy (\u201chelp users be independent\u201d) contradicted Match Group\u2019s \u201chumans need humans\u201d mission\n\u2022 Strategic question got a tactical answer (\u201cphased rollout\u201d instead of a framework)\n\u2022 Portfolio ran 40+ min instead of 25-30 max\n\u2022 Wrong portfolio choices (B2B SaaS + designer tool instead of consumer product work)\n\u2022 Generic behavioral answers instead of specific STAR stories\n\nThese two questions WERE the interview. Everything else was context.`),k(`ACTION ITEMS\n\n1. Write a design philosophy (3-4 sentences) for consumer products \u2014 test: does it align with human connection, trust, or simplification?\n2. Practice strategic questions with frameworks, not tactics: Diagnose \u2192 Framework \u2192 Validate \u2192 Trade-offs\n3. Tighten template story to 8 min: Context (30s) \u2192 Challenge (1m) \u2192 Approach (2m) \u2192 Key Decision (2m) \u2192 Impact (1m) \u2192 Learning (1.5m)\n4. Replace Figma plugin with Wallet, IA restructure, or Design System for consumer roles\n5. Build a STAR story bank: 6-8 specific stories covering collaboration, strategy, ownership, craft, failure\n6. Practice with a timer \u2014 8 min per project, 2 min per STAR answer\n7. Research company mission + strategic challenges BEFORE every interview`),k(`QUESTIONS I SHOULD HAVE ASKED\n\n1. \u201cPOF is an Evergreen brand with 90M users. How do you balance maintaining trust with that base while innovating for Gen Z?\u201d \u2014 Shows you understand their core tension\n2. \u201cWhat\u2019s the biggest tension between what users say they want and what actually drives retention?\u201d \u2014 Shows strategic product thinking\n3. \u201cCan you walk me through a recent project where design, product, and engineering had to navigate a tough trade-off?\u201d \u2014 Shows you think about real constraints\n4. \u201cWhat does success look like for this role in the first 6 months?\u201d \u2014 Shows outcome-focus`)],qaPairs:[S("What\u2019s your design philosophy?","[YOUR ANSWER]\n1. Help users be independent/self-sufficient \n2. Design is teamwork, I facilitate communication through workshops\n3. I see my teammates as end users\n\n[WHY IT FAILED]\n\u2022 Philosophy contradicts Match Group\u2019s mission \u2014 you said \u201cindependent\u201d but their mission is \u201chumans need humans\u201d and reducing loneliness through connection\n\u2022 \u201cDesign is teamwork\u201d is process, not philosophy \u2014 a philosophy is about how you think about design problems and what principles guide decisions\n\u2022 \u201cTeammates as end users\u201d is confusing \u2014 teammates are partners, not users\n\n[BETTER ANSWER]\n\u201cMy design philosophy is that good design removes barriers between people and what matters to them. In dating, that means helping people form meaningful connections without the friction of bad UI, confusing flows, or features that feel manipulative. I believe the best products feel invisible \u2014 users shouldn\u2019t be thinking about the interface, they should be thinking about the person they\u2019re talking to.\u201d\n\n[WHY IT\u2019S BETTER]\n\u2022 Aligns with Match Group\u2019s \u201chumans need humans\u201d mission\n\u2022 Shows you understand dating products specifically\n\u2022 Demonstrates user-centered thinking in their domain\n\u2022 \u201cInvisible design\u201d shows craft-level thinking"),S("How do you balance user trust vs. evolved design?","[CONTEXT]\nPOF has a legacy UI (early 2010s aesthetic). Users say they want sleeker UI. But POF has 90M+ loyal users familiar with the current experience. Sarah was really asking: \u201cIf we hired you, how would you modernize POF without alienating our existing user base?\u201d\n\n[YOUR ANSWER]\n\u201cI deliver designs in phases so users aren\u2019t surprised by abrupt changes, keeping aware of existing UX patterns.\u201d\n\n[WHY IT FAILED]\n\u2022 This is a tactics answer to a strategy question \u2014 \u201cphased rollout\u201d is an implementation plan, not a framework\n\u2022 Completely skipped the hard part: How do you decide WHAT to change vs. keep? How do you know when evolved design is worth the risk?\n\u2022 Any junior designer could suggest \u201cdo it in phases\u201d \u2014 she wanted senior-level strategic thinking\n\n[BETTER ANSWER]\n\u201cFirst, I\u2019d validate what \u2018sleek UI\u2019 actually means to users. When users say they want something more modern, they\u2019re often reacting to friction points \u2014 slow load times, cluttered screens, outdated visual hierarchy \u2014 not necessarily asking for a full redesign.\n\nSo I\u2019d start by identifying the highest-friction areas through user research and behavioral data. Then I\u2019d apply a principle: modernize the structure, preserve the familiarity. That means improving visual hierarchy, cleaning up information density, and refining interactions \u2014 but keeping core navigation patterns and mental models intact.\n\nAnd I\u2019d test incrementally. Roll out changes to a small percentage of users, measure engagement and sentiment, and only scale if trust metrics hold steady. The goal isn\u2019t to make POF look like every other dating app \u2014 it\u2019s to make it feel effortless to use while still feeling like POF.\u201d\n\n[WHY IT\u2019S BETTER]\n\u2022 Shows nuance \u2014 users say \u201csleek\u201d but may mean \u201cless friction\u201d\n\u2022 Gives a clear framework: modernize structure, preserve familiarity\n\u2022 Research-first mindset \u2014 validate before acting\n\u2022 Acknowledges POF\u2019s unique brand identity\n\u2022 Addresses actual business risk (alienating 90M users)"),S("When you presented your research, was there anything missing?","[YOUR ANSWER]\n\u201cI should have been more specific about user maturity.\u201d\n\n[WHY IT\u2019S WEAK]\n\u2022 Felt like you were searching for an answer on the spot\n\u2022 \u201cUser maturity\u201d is vague \u2014 what does that mean concretely?\n\u2022 Missed a chance to show self-awareness about research rigor\n\n[BETTER ANSWER]\n\u201cYes \u2014 I didn\u2019t have direct user behavioral data. My research was qualitative (surveys, stakeholder interviews, heuristic evaluation), but I was missing quantitative usage analytics. If I could redo it, I\u2019d push harder to get data on actual user paths and drop-off points before proposing solutions. The internal survey validated direction, but quantitative data would have made my prioritization framework much stronger and more defensible.\u201d\n\n[WHY IT\u2019S BETTER]\n\u2022 Specific about WHAT was missing (quantitative behavioral data)\n\u2022 Shows you understand qual vs. quant research gap\n\u2022 Demonstrates what you\u2019d do differently (push for analytics)\n\u2022 Self-aware without being apologetic"),S("What was something you didn\u2019t expect to happen?","[YOUR ANSWER]\n\u201cThat happens a lot... communication is the key... bring it up right away with coworkers.\u201d\n\n[WHY IT FAILED]\n\u2022 This is a STAR question and you gave a principle instead of an example\n\u2022 \u201cCommunication is key\u201d is the most generic answer possible\n\u2022 No specific story, no concrete situation, no measurable outcome\n\u2022 \u201cThat happens a lot\u201d dismisses the question instead of engaging with it\n\n[BETTER ANSWER]\n\u201cWhen we launched the templates, I didn\u2019t expect CS to push back on the 70/30 ratio. They wanted 100% customization \u2014 they\u2019d been promising clients full flexibility for years. I had to facilitate a session where we walked through real client data to show that 90% of requests fell into common patterns. That shifted the conversation from \u2018we need flexibility\u2019 to \u2018we need smart defaults.\u2019 Taught me that resistance usually means people need to see the evidence, not just hear the logic.\u201d\n\n[WHY IT\u2019S BETTER]\n\u2022 Specific situation (CS pushback on 70/30)\n\u2022 Concrete action (facilitated data-driven session)\n\u2022 Clear outcome (shifted the conversation)\n\u2022 Real learning (evidence > logic for buy-in)\n\u2022 Follows STAR format naturally"),S("What was the biggest challenge when coming up with the templates?","[YOUR ANSWER]\n\u201cNo direct user access... I triangulated 3 methods...\u201d\n\n[WHY IT\u2019S WEAK]\n\u2022 You already explained this during the presentation \u2014 repeating it shows lack of depth\n\u2022 Behavioral questions need NEW information, not a rehash\n\u2022 Missed an opportunity to show a different dimension of the challenge\n\n[BETTER ANSWER]\n\u201cThe hardest part was getting engineering buy-in. They were skeptical that templates would actually work across such diverse clients \u2014 500+ companies with different brands, program types, and requirements. I prototyped 5 real client programs using the template system and showed them it could handle 80% of cases without custom code. That proof-of-concept shifted the conversation from \u2018this won\u2019t scale\u2019 to \u2018let\u2019s build it.\u2019 The lesson was: don\u2019t argue feasibility \u2014 demonstrate it.\u201d\n\n[WHY IT\u2019S BETTER]\n\u2022 Different challenge than what you presented (eng buy-in, not research)\n\u2022 Shows cross-functional influence (convincing engineering)\n\u2022 Demonstrates initiative (built proof-of-concept unprompted)\n\u2022 Concrete outcome (shifted from skepticism to commitment)\n\u2022 Clear learning (demonstrate, don\u2019t argue)"),S("Why did you choose the Figma Plugin as your second project?","[WHAT HAPPENED]\nYou presented: (1) Template System (B2B SaaS) and (2) Figma Plugin (designer tool built with AI). The plugin took 15-20 min.\n\n[WHY IT DIDN\u2019T LAND]\n\u2022 Scope mismatch \u2014 interviewing for a consumer dating product, showed a designer tool with no cross-functional collaboration or user research\n\u2022 AI focus made AI the hero, not your design thinking \u2014 \u201cI built this in 7 hours\u201d undermines craft\n\u2022 No real user impact \u2014 16 users vs. your template project\u2019s 500+ clients\n\u2022 Sarah was probably thinking: \u201cHow does this show me she can design our core product?\u201d\n\n[WHAT TO SHOW INSTEAD]\nOption A: Wallet Product \u2014 net-new consumer product, 4-week discovery, C-suite + Goldman Sachs sign-off. Shows strategic thinking + consumer product sense.\nOption B: IA/User Flow Restructure \u2014 audited UI, cut steps from 4 to 2, improved task completion. Shows product thinking + simplification.\nOption C: Design System \u2014 built with engineering, eliminated manual redlining, 33% faster delivery. Shows systems thinking + eng collaboration.\n\n[KEY LESSON]\nMatch portfolio to the role. Consumer roles need consumer work. Impact at scale (30% revenue growth) > novelty (AI plugin with 16 users)."),S("Why did the interview run over time?","[WHAT HAPPENED]\nPortfolio ran 40+ min instead of allotted 30 min. Behavioral questions got compressed. Only 9 minutes left for your questions.\n\nSarah\u2019s signals you missed:\n\u2022 \u201cI could just slack you or email you these questions\u201d \u2014 politely saying time is up\n\u2022 \u201cI want to be mindful that there\u2019s only 9 minutes left\u201d \u2014 direct time warning\n\n[WHY IT MATTERS]\n\u2022 Signals you can\u2019t manage time in structured conversations\n\u2022 Suggests you may struggle with prioritization in actual work\n\u2022 Shows lack of senior judgment \u2014 reading the room is a senior skill\n\n[THE FIX]\n\u2022 8-10 min per project MAX (practice with timer)\n\u2022 Use structure: Context (30s) \u2192 Challenge (1m) \u2192 Approach (2m) \u2192 Key Decision (2m) \u2192 Impact (1m) \u2192 Learning (1.5m)\n\u2022 Watch for interviewer cues \u2014 when they mention time, wrap up immediately\n\u2022 Aim for 25 min total so you have buffer")]},{id:x(),name:"General",category:"HR Screening",notes:[k(`GENERAL HR SCREENING PREP

Common questions to prepare for:
\u{2022} Tell me about yourself / walk me through your resume
\u{2022} Why are you interested in this role / company?
\u{2022} What are you looking for in your next role?
\u{2022} Salary expectations
\u{2022} Timeline / availability
\u{2022} Why did you leave your last role?

Key tips:
\u{2022} Keep "tell me about yourself" to 60\u{2013}90 seconds
\u{2022} Research the company's product, recent news, and team before every screen
\u{2022} Have 2\u{2013}3 thoughtful questions ready about the role, team, or product
\u{2022} Be specific about what excites you \u{2014} generic enthusiasm doesn't land`)],qaPairs:[]}];function N(){return Math.random().toString(36).substring(2,11)+Date.now().toString(36)}function C(e,t){switch(t.type){case"SET_MODE":return{...e,mode:t.mode};case"SET_ACTIVE_STAGE":return{...e,activeStageId:t.stageId};case"ADD_STAGE":{let n={id:N(),name:t.name,category:t.category,notes:[],qaPairs:[]};return{...e,stages:[...e.stages,n],activeStageId:n.id}}case"RENAME_STAGE":return{...e,stages:e.stages.map(e=>e.id===t.stageId?{...e,name:t.name}:e)};case"DELETE_STAGE":{let n=e.stages.filter(e=>e.id!==t.stageId);return{...e,stages:n,activeStageId:e.activeStageId===t.stageId?n[0]?.id??null:e.activeStageId}}case"ADD_NOTE":{let n={id:N(),content:t.content,createdAt:Date.now()};return{...e,stages:e.stages.map(e=>e.id===t.stageId?{...e,notes:[...e.notes,n]}:e)}}case"UPDATE_NOTE":return{...e,stages:e.stages.map(e=>e.id===t.stageId?{...e,notes:e.notes.map(e=>e.id===t.noteId?{...e,content:t.content}:e)}:e)};case"DELETE_NOTE":return{...e,stages:e.stages.map(e=>e.id===t.stageId?{...e,notes:e.notes.filter(e=>e.id!==t.noteId)}:e)};case"ADD_QA":{let n={id:N(),question:t.question,answer:t.answer,confidence:"none",pinned:!1,highlights:[],lastReviewed:null,createdAt:Date.now()};return{...e,stages:e.stages.map(e=>e.id===t.stageId?{...e,qaPairs:[...e.qaPairs,n]}:e)}}case"UPDATE_QA":return{...e,stages:e.stages.map(e=>e.id===t.stageId?{...e,qaPairs:e.qaPairs.map(e=>e.id===t.qaId?{...e,...void 0!==t.question&&{question:t.question},...void 0!==t.answer&&{answer:t.answer}}:e)}:e)};case"DELETE_QA":return{...e,stages:e.stages.map(e=>e.id===t.stageId?{...e,qaPairs:e.qaPairs.filter(e=>e.id!==t.qaId)}:e)};case"RATE_QA":return{...e,stages:e.stages.map(e=>e.id===t.stageId?{...e,qaPairs:e.qaPairs.map(e=>e.id===t.qaId?{...e,confidence:t.confidence,lastReviewed:Date.now()}:e)}:e)};case"TOGGLE_PIN":return{...e,stages:e.stages.map(e=>e.id===t.stageId?{...e,qaPairs:e.qaPairs.map(e=>e.id===t.qaId?{...e,pinn
